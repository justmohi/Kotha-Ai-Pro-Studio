<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Safeguard for browser/iframe environments where Window.prototype.fetch only has a getter
    (function() {
      try {
        var rawFetch = window.fetch;
        var _activeFetch = typeof rawFetch === 'function' ? rawFetch.bind(window) : rawFetch;
        Object.defineProperty(window, 'fetch', {
          get: function() {
            return _activeFetch;
          },
          set: function(fn) {
            _activeFetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (_) {}
    })();
  </script>
